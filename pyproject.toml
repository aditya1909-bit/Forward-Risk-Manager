[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forward-risk-manager"
version = "0.1.0"
description = "Forward-Forward GNN risk modeling tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
