[build_graphs]
prices = "data/raw_merged/prices.csv"
constituents = "data/raw_merged/constituents.csv"
fundamentals = "data/raw_merged/fundamentals.csv"
window = 20
feature_mode = "window_plus_summary_fund"

[train]
graphs = "data/processed_long/graphs_constituents.pt"
epochs = 240
batch_size = 128
lr = 0.001
hidden_dim = 128
num_layers = 2
dropout = 0.1
goodness_target = 2.697421237500001
goodness_temp = 0.052428800000000025
self_contrastive_temp = 0.15
self_contrastive_view_mode = "noise"
self_contrastive_view_noise_std = 0.05
self_contrastive_ff_weight = 0.1
self_contrastive_ff_neg_mode = "shuffle+noise"
self_contrastive_ff_noise_std = 0.05
self_contrastive_ff_target = 2.697421237500001
distance_forward_weight = 0.02
distance_forward_margin = 0.15
# FF speed knobs (preserve objective, reduce per-batch cost)
self_contrastive_max_graphs = 96
distance_forward_max_graphs = 64
distance_forward_interval = 2
amp = true
amp_dtype = "float16"
fused_optimizer = true
ff_layerwise = false
ff_blockwise = true
ff_block_size = 2
ff_multiscale = true
neg_mode = "time_flip+noise"
noise_std = 0.05
device = "auto"
loader_workers = 0
torch_num_threads = 2
torch_num_interop_threads = 1
dataloader_persistent_workers = false
dataloader_prefetch_factor = 2
dataloader_pin_memory = true
dataloader_mp_context = ""
seed = 7
log_csv = "runs/experiments/long_constituents/metrics/ff_train.csv"
plot_path = "runs/experiments/long_constituents/plots/ff_train.png"
save_model = "runs/experiments/long_constituents/models/ff_model.pt"
save_encoder = "runs/experiments/long_constituents/models/encoder.pt"
save_critic = "runs/experiments/long_constituents/models/critic.pt"
encoder_checkpoint_in = ""
critic_checkpoint_in = ""
strict_component_split = false
freeze_encoder = false
freeze_critic = false
critic_hidden_dim = 128
critic_num_layers = 2
critic_dropout = 0.1
critic_positive_activation = "softplus"
auto_tune_batch = true
auto_tune_max_batch = 256
auto_tune_factor = 2
auto_tune_min_batch = 1
neg_warmup_epochs = 10
neg_mix_start = 0.0
neg_mix_end = 0.1
neg_mix_ramp_epochs = 40
neg_gate_margin = 0.6499999999999999
grad_clip = 1.0
energy_penalty_weight = 0.0002
energy_penalty_mode = "last"
self_contrastive_energy_penalty_scale = 0.0
risk_head_enabled = true
risk_ticker = "BWC"
risk_horizon = 21
risk_horizons = [5, 21, 63]
risk_loss_weight = 0.15
risk_loss_type = "huber"
risk_standardize = true
risk_cache_dir = "runs/cache"
risk_max_abs_logret = 0.35

# Hallucinated negatives (used when neg_mode = "hallucinate")
hallucinate_steps = 10
hallucinate_lr = 0.03361399999999999
hallucinate_l2 = 0.04
hallucinate_mean = 0.006
hallucinate_std = 0.006
hallucinate_corr = 0.35
hallucinate_clamp_std = 3.0
hallucinate_node_fraction = 0.4
hallucinate_node_min = 15
hallucinate_init_noise = 0.05
hallucinate_penalty_scope = "returns"
hallucinate_corr_scope = "returns"
hallucinate_freeze_non_return_features = true
hallucinate_min_delta = 0.05
hallucinate_fallback_noise = 1.0
adaptive_hallucination = true
adaptive_hall_close_high = 0.75
adaptive_hall_hardness_low = -0.2
adaptive_hall_hardness_high = 0.4
adaptive_hall_lr_mult = 1.15
adaptive_hall_lr_max = 0.12
adaptive_hall_steps_inc = 1
adaptive_hall_steps_max = 10
adaptive_hall_node_inc = 0.05
adaptive_hall_reg_mult = 0.9
adaptive_hall_reg_min = 0.001
adaptive_hall_min_delta_mult = 0.9
adaptive_hall_min_delta_min = 0.005
adaptive_hall_ratio_high = 0.8
adaptive_mix_step = 0.05
adaptive_mix_end_max = 0.75
adaptive_gate_margin_step = 0.05
adaptive_gate_margin_min = 0.1
adaptive_gate_margin_max = 2.5
adaptive_goodness_target = false
adaptive_goodness_target_warmup = 5
adaptive_goodness_target_alpha = 0.15
adaptive_goodness_target_margin = 0.0
adaptive_goodness_target_min = 0.1
adaptive_goodness_target_max = 10.0

layerwise_neg_mode = "shuffle"
layerwise_noise_std = 0.05
layerwise_hall_corr = 0.0
layerwise_hall_mean = 0.006
layerwise_hall_std = 0.006
[train.hallucinate_curriculum]
enabled = true
start_epoch = 5
ramp_epochs = 30
steps_start = 1
steps_end = 6
lr_start = 0.02
lr_end = 0.05
l2_start = 0.08
l2_end = 0.04
corr_start = 0.3
corr_end = 0.35
node_fraction_start = 0.2
node_fraction_end = 0.4
node_min_start = 10
node_min_end = 15

[scenario_book]
constraint_mode = "exact"
constraint_tolerance = 0.01
constraint_weight = 60.0
target_hit_rate = 0.85
target_tolerance = 0.02
max_adapt_steps = 18
max_nontarget_drift = 0.03
nontarget_drift_weight = 4.0
nontarget_drift_tolerance = 0.01
adapt_constraint_mult = 1.7
adapt_hall_step_inc = 3
adapt_hall_lr_mult = 1.25
adapt_hall_l2_mult = 0.85
adapt_hall_mean_mult = 0.85
adapt_hall_std_mult = 0.85
adapt_hall_corr_mult = 0.85
adapt_nontarget_mult = 1.4
adapt_max_nontarget_weight = 300.0
adapt_nontarget_reg_mult = 1.15
min_hall_delta = 0.002
hall_retry_limit = 2
hall_retry_lr_mult = 1.5
hall_retry_steps_inc = 2
hall_retry_clamp_inc = 0.5
hall_retry_node_inc = 0.1
critic_model = "runs/experiments/long_constituents/models/critic.pt"
diag_out = "runs/experiments/long_constituents/diagnostics/scenario_constraint_diagnostics.csv"
out = "runs/experiments/long_constituents/metrics/scenario_book.csv"

[benchmark]
