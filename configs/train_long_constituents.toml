[build_graphs]
prices = "data/raw_merged/prices.csv"
constituents = "data/raw_merged/constituents.csv"
fundamentals = "data/raw_merged/fundamentals.csv"
window = 20
feature_mode = "window_plus_summary_fund"

[train]
graphs = "data/processed_long/graphs_constituents.pt"
epochs = 100
batch_size = 128
lr = 0.001
hidden_dim = 128
num_layers = 2
dropout = 0.1
goodness_target = 3.3000000000000003
goodness_temp = 0.2
ff_layerwise = false
ff_multiscale = true
neg_mode = "mix"
noise_std = 0.05
device = "auto"
loader_workers = 0
torch_num_threads = 2
torch_num_interop_threads = 1
dataloader_persistent_workers = false
dataloader_prefetch_factor = 2
dataloader_pin_memory = true
dataloader_mp_context = ""
seed = 7
log_csv = "reports/ff_train_long_constituents.csv"
plot_path = "reports/ff_train_long_constituents.png"
save_model = "runs/ff_model_long_constituents.pt"
auto_tune_batch = true
auto_tune_max_batch = 128
auto_tune_factor = 2
auto_tune_min_batch = 1
neg_warmup_epochs = 10
neg_mix_start = 0.0
neg_mix_end = 0.65
neg_mix_ramp_epochs = 40
neg_gate_margin = 1.3
grad_clip = 1.0
energy_penalty_weight = 0.0002
energy_penalty_mode = "last"
risk_head_enabled = true
risk_ticker = "BWC"
risk_horizon = 21
risk_loss_weight = 0.1
risk_loss_type = "huber"
risk_standardize = true
risk_cache_dir = "runs/cache"
risk_max_abs_logret = 0.35

# Hallucinated negatives (used when neg_mode = "hallucinate")
hallucinate_steps = 8
hallucinate_lr = 0.05
hallucinate_l2 = 0.04
hallucinate_mean = 0.006
hallucinate_std = 0.006
hallucinate_corr = 0.35
hallucinate_clamp_std = 3.0
hallucinate_node_fraction = 0.25
hallucinate_node_min = 15
hallucinate_init_noise = 0.05
hallucinate_penalty_scope = "returns"
hallucinate_corr_scope = "returns"
hallucinate_freeze_non_return_features = true
hallucinate_min_delta = 0.05
hallucinate_fallback_noise = 1.0
adaptive_hallucination = true
adaptive_hall_close_high = 0.75
adaptive_hall_hardness_low = -0.2
adaptive_hall_hardness_high = 0.4
adaptive_hall_lr_mult = 1.15
adaptive_hall_lr_max = 0.12
adaptive_hall_steps_inc = 1
adaptive_hall_steps_max = 10
adaptive_hall_node_inc = 0.05
adaptive_hall_reg_mult = 0.9
adaptive_hall_reg_min = 0.001
adaptive_hall_min_delta_mult = 0.9
adaptive_hall_min_delta_min = 0.005
adaptive_hall_ratio_high = 0.8
adaptive_mix_step = 0.05
adaptive_mix_end_max = 0.75
adaptive_gate_margin_step = 0.05
adaptive_gate_margin_min = 0.1
adaptive_gate_margin_max = 2.5
adaptive_goodness_target = true
adaptive_goodness_target_warmup = 5
adaptive_goodness_target_alpha = 0.15
adaptive_goodness_target_margin = 0.0
adaptive_goodness_target_min = 0.1
adaptive_goodness_target_max = 10.0

layerwise_neg_mode = "shuffle"
layerwise_noise_std = 0.05
layerwise_hall_corr = 0.0
layerwise_hall_mean = 0.006
layerwise_hall_std = 0.006
[train.hallucinate_curriculum]
enabled = true
start_epoch = 5
ramp_epochs = 30
steps_start = 1
steps_end = 6
lr_start = 0.02
lr_end = 0.05
l2_start = 0.08
l2_end = 0.04
corr_start = 0.3
corr_end = 0.35
node_fraction_start = 0.2
node_fraction_end = 0.4
node_min_start = 10
node_min_end = 15

[scenario_book]
min_hall_delta = 0.002
hall_retry_limit = 2
hall_retry_lr_mult = 1.5
hall_retry_steps_inc = 2
hall_retry_clamp_inc = 0.5
hall_retry_node_inc = 0.1

[benchmark]
epochs = 5
eval_frac = 0.2
split_mode = "chronological"
eval_neg_mode = "shuffle"
timing_warmup_epochs = 1
calibrate_target = true
calibrate_batches = 0
calibrate_quantiles = 31

[sweep]
epochs = 4
eval_frac = 0.2
split_mode = "chronological"
eval_neg_mode = "shuffle"
timing_warmup_epochs = 1
auto_expand = true
auto_expand_size = 14
auto_expand_seed = 173
speed_weight = 0.35
top_k = 10
