[build_graphs]
prices = "data/raw_merged/prices.csv"
constituents = "data/raw_merged/constituents.csv"
fundamentals = "data/raw_merged/fundamentals.csv"
window = 20
feature_mode = "window_plus_summary_fund"

[train]
graphs = "data/processed_long/graphs_alltickers.pt"
epochs = 200
batch_size = 32
lr = 0.001
hidden_dim = 128
num_layers = 3
dropout = 0.1
goodness_target = 2.0
goodness_temp = 0.25
self_contrastive_temp = 0.2
distance_forward_weight = 0.05
distance_forward_margin = 0.15
ff_layerwise = false
ff_multiscale = true
neg_mode = "self_contrastive"
noise_std = 0.05
device = "auto"
loader_workers = 0
torch_num_threads = 2
torch_num_interop_threads = 1
dataloader_persistent_workers = false
dataloader_prefetch_factor = 2
dataloader_pin_memory = true
dataloader_mp_context = ""
seed = 7
log_csv = "runs/experiments/long_alltickers/metrics/ff_train.csv"
plot_path = "runs/experiments/long_alltickers/plots/ff_train.png"
save_model = "runs/experiments/long_alltickers/models/ff_model.pt"
auto_tune_batch = true
auto_tune_max_batch = 32
auto_tune_factor = 2
auto_tune_min_batch = 1
neg_warmup_epochs = 10
neg_mix_start = 0.0
neg_mix_end = 0.8
neg_mix_ramp_epochs = 40
neg_gate_margin = 1.0
grad_clip = 1.0
energy_penalty_weight = 0.0001
energy_penalty_mode = "last"
risk_head_enabled = true
risk_ticker = "MDY"
risk_horizon = 21
risk_loss_weight = 0.1
risk_loss_type = "huber"
risk_standardize = true
risk_cache_dir = "runs/cache"
risk_max_abs_logret = 0.35

# Hallucinated negatives (used when neg_mode = "hallucinate")
hallucinate_steps = 4
hallucinate_lr = 0.03
hallucinate_l2 = 0.04
hallucinate_mean = 0.006
hallucinate_std = 0.006
hallucinate_corr = 0.25
hallucinate_clamp_std = 3.0
hallucinate_node_fraction = 0.4
hallucinate_node_min = 15
hallucinate_penalty_scope = "returns"
hallucinate_corr_scope = "returns"
hallucinate_freeze_non_return_features = true
adaptive_hall_ratio_high = 0.8
adaptive_mix_end_max = 0.85

[train.hallucinate_curriculum]
enabled = true
start_epoch = 5
ramp_epochs = 30
steps_start = 1
steps_end = 4
lr_start = 0.02
lr_end = 0.03
l2_start = 0.08
l2_end = 0.04
corr_start = 0.3
corr_end = 0.25
node_fraction_start = 0.2
node_fraction_end = 0.4
node_min_start = 10
node_min_end = 15
