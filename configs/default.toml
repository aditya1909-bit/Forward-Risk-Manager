[build_graphs]
prices = "data/processed/prices.csv"
constituents = "data/processed/constituents.csv"
macro = ""
out = "data/processed/graphs.pt"
membership_mode = "constituents"
window = 20
step = 1
corr_lag_days = 0
feature_lag_days = 0
membership_lag_days = 0
top_k = 5
corr_threshold = ""
min_nodes = 50
feature_mode = "window_plus_summary"
rsi_period = 14
mdy_ticker = "AUTO"
normalize = true
symmetric = true
edge_norm = true
edge_weight_mode = "raw"
corr_method = "pearson"
partial_corr_ridge = 0.001
edge_select_mode = "top_k"
significance_alpha = 0.05
cross_sectional_norm = false
edge_node_weighting = "none"
edge_node_weight_power = 0.5
include_tickers = []
workers = 7
parallel_backend = "threadpool"
joblib_prefer = "threads"
joblib_n_jobs = 0
progress = true

[train]
graphs = "data/processed/graphs.pt"
epochs = 200
batch_size = 32
lr = 0.001
hidden_dim = 128
num_layers = 3
dropout = 0.1
encoder_conv_type = "gcn"
encoder_gat_heads = 2
goodness_target = 2.0
goodness_temp = 0.25
ff_margin = 0.0
ff_margin_weight = 1.0
self_contrastive_temp = 0.2
self_contrastive_view_mode = "shuffle+noise"
self_contrastive_view_noise_std = 0.05
distance_forward_weight = 0.02
distance_forward_margin = 0.15
ff_layerwise = false
ff_multiscale = true
energy_penalty_weight = 0.0001
energy_penalty_mode = "last"
risk_head_enabled = true
risk_ticker = "AUTO"
risk_horizon = 21
risk_loss_weight = 0.02
risk_loss_type = "huber"
risk_standardize = true
risk_cache_dir = "runs/cache"
risk_max_abs_logret = 0.5
neg_mode = "shuffle+noise"
noise_std = 0.05
device = "auto"
loader_workers = 0
torch_num_threads = 2
torch_num_interop_threads = 1
dataloader_persistent_workers = false
dataloader_prefetch_factor = 2
dataloader_pin_memory = true
dataloader_mp_context = ""
seed = 7
log_csv = "runs/experiments/default/metrics/ff_train.csv"
plot_path = "runs/experiments/default/plots/ff_train.png"
save_model = "runs/experiments/default/models/ff_model.pt"
save_encoder = "runs/experiments/default/models/encoder.pt"
save_critic = "runs/experiments/default/models/critic.pt"
encoder_checkpoint_in = ""
critic_checkpoint_in = ""
strict_component_split = false
freeze_encoder = false
freeze_critic = false
critic_hidden_dim = 128
critic_num_layers = 2
critic_dropout = 0.1
critic_positive_activation = "softplus"
auto_tune_batch = true
auto_tune_max_batch = 32
auto_tune_factor = 2
auto_tune_min_batch = 1
neg_warmup_epochs = 10
neg_mix_start = 0.0
neg_mix_end = 0.8
neg_mix_ramp_epochs = 40
neg_gate_margin = 1.0
grad_clip = 1.0
layerwise_neg_mode = "shuffle+noise"
layerwise_noise_std = 0.12
layerwise_hall_corr = 0.0
layerwise_hall_mean = 0.01
layerwise_hall_std = 0.01

# Hallucinated negatives (used when neg_mode = "hallucinate")
hallucinate_steps = 4
hallucinate_lr = 0.03
hallucinate_l2 = 0.04
hallucinate_mean = 0.006
hallucinate_std = 0.006
hallucinate_corr = 0.25
hallucinate_clamp_std = 3.0
hallucinate_node_fraction = 0.4
hallucinate_node_min = 15
hallucinate_corr_every_n_steps = 1
hallucinate_corr_edge_fraction = 1.0
hallucinate_corr_edge_min = 1
hallucinate_penalty_scope = "returns"
hallucinate_corr_scope = "returns"
hallucinate_freeze_non_return_features = true
hallucinate_adaptive_lr = false
hallucinate_adaptive_lr_patience = 2
hallucinate_adaptive_lr_decay = 0.5
hallucinate_adaptive_lr_min = 0.0001
hallucinate_early_stop_on_target_hit = false
hallucinate_target_hit_patience = 1
hallucinate_moment_mean = 0.0
hallucinate_moment_var = 0.0
hallucinate_moment_skew = 0.0
hallucinate_moment_scope = "returns"
adaptive_hall_ratio_high = 0.8
adaptive_mix_end_max = 0.85

[benchmark]
epochs = 5
batch_size = 32
eval_frac = 0.2
split_mode = "walk_forward"
walk_forward_train_frac = 0.6
walk_forward_eval_frac = 0.2
walk_forward_step_frac = 0.1
walk_forward_min_train_graphs = 128
walk_forward_min_eval_graphs = 32
walk_forward_max_folds = 0
walk_forward_out_csv = "runs/experiments/default/metrics/benchmark_walk_forward_folds.csv"
neg_mode = "shuffle+noise"
eval_neg_mode = "auto"
eval_neg_modes = ["time_flip", "block_bootstrap", "cross_asset_mix", "phase_randomize"]
self_contrastive_eval_view_mode = "shuffle+noise"
self_contrastive_eval_noise_std = 0.05
ece_bins = 10
timing_warmup_epochs = 1
econ_enabled = true
econ_ticker = "AUTO"
econ_signal_window = 126
econ_signal_quantile = 0.5
econ_turnover_cost_bps = 0.0
econ_slippage_bps = 0.0
econ_slippage_vol_scale = 0.0
econ_slippage_vol_lookback = 21
econ_max_abs_logret = 0.5
out_csv = "runs/experiments/default/metrics/benchmark.csv"
plot_path = "runs/experiments/default/plots/benchmark_speed_sep.png"
bar_plot_path = "runs/experiments/default/plots/benchmark.png"

[sweep]
epochs = 3
batch_size = 32
eval_frac = 0.2
split_mode = "walk_forward"
walk_forward_train_frac = 0.6
walk_forward_eval_frac = 0.2
walk_forward_step_frac = 0.1
walk_forward_min_train_graphs = 128
walk_forward_min_eval_graphs = 32
walk_forward_max_folds = 0
eval_neg_mode = "auto"
eval_neg_modes = ["time_flip", "block_bootstrap", "cross_asset_mix", "phase_randomize"]
self_contrastive_eval_view_mode = "shuffle+noise"
self_contrastive_eval_noise_std = 0.05
ece_bins = 10
timing_warmup_epochs = 1
rank_mode = "finance_first"
econ_weight = 0.45
sep_weight = 0.35
speed_weight = 0.20
econ_enabled = true
econ_ticker = "AUTO"
econ_signal_window = 126
econ_signal_quantile = 0.5
econ_turnover_cost_bps = 0.0
econ_slippage_bps = 0.0
econ_slippage_vol_scale = 0.0
econ_slippage_vol_lookback = 21
econ_max_abs_logret = 0.5
out_csv = "runs/experiments/default/metrics/ff_sweep.csv"
modes = ["ff_layerwise", "ff_e2e"]
goodness_temp = [0.2, 0.25]
goodness_target = [1.5, 2.0]
neg_mix_end = [0.5, 0.7]
hall_steps = [1, 2]
hall_lr = [0.02, 0.03]
hall_node_fraction = [0.2]
top_k = 10
parallel_workers = 1
parallel_backend = "process"
parallel_mp_context = "spawn"
parallel_force_cpu = true
worker_torch_threads = 1
worker_torch_interop_threads = 1
worker_loader_workers = 0

[sweep_layerwise]
epochs = 3
batch_size = 32
eval_frac = 0.2
split_mode = "chronological"
eval_neg_mode = "auto"
timing_warmup_epochs = 1
out_csv = "runs/experiments/default/metrics/ff_sweep_layerwise.csv"
modes = ["ff_layerwise"]
goodness_temp = [0.2, 0.25]
goodness_target = [1.5, 2.0]
neg_mix_end = [0.5, 0.7]
hall_steps = [1, 2]
hall_lr = [0.02, 0.03]
hall_node_fraction = [0.2]
layerwise_neg_mode = ["shuffle+noise"]
layerwise_noise_std = [0.08, 0.12, 0.16]
layerwise_hall_corr = [0.0]
layerwise_hall_mean = [0.01]
layerwise_hall_std = [0.01]
top_k = 10

[sweep_tune]
out_csv = "runs/experiments/default/metrics/sweep_parallel_tune.csv"
device = "cpu"
epochs = 2
batch_size = 32
sample_graphs = 256
max_batches = 5
neg_mode = "shuffle"
parallel_backend = "process"
parallel_mp_context = "spawn"
parallel_workers = [1, 2, 3, 4]
worker_torch_threads = [1, 2]
worker_torch_interop_threads = [1]
worker_loader_workers = [0, 1]
apply = true
apply_to = "configs/default.toml"
apply_section = "sweep"
apply_min_improvement = 0.1
apply_backup = true
apply_backup_suffix = ".bak"
isolate_thread_settings = true

[train.hallucinate_curriculum]
enabled = true
start_epoch = 5
ramp_epochs = 30
steps_start = 1
steps_end = 4
lr_start = 0.02
lr_end = 0.03
l2_start = 0.08
l2_end = 0.04
corr_start = 0.3
corr_end = 0.25
node_fraction_start = 0.2
node_fraction_end = 0.4
node_min_start = 10
node_min_end = 15

[scenario_book]
num_scenarios = 50
target_ticker = "AUTO"
target_drop = -0.10
constraint_mode = "exact"
constraint_tolerance = 0.01
constraint_weight = 20.0
adaptive = true
target_hit_rate = 0.6
target_tolerance = 0.01
max_adapt_steps = 40
critic_model = "runs/experiments/default/models/critic.pt"
diag_out = "runs/experiments/default/diagnostics/scenario_constraint_diagnostics.csv"
out = "runs/experiments/default/metrics/scenario_book.csv"

[encoder]
neg_mode = "self_contrastive"
strict_component_split = true
freeze_critic = true
save_encoder = "runs/experiments/default/models/encoder.pt"

[critic]
neg_mode = "time_flip+noise"
strict_component_split = true
freeze_encoder = true
encoder_checkpoint_in = "runs/experiments/default/models/encoder.pt"
save_critic = "runs/experiments/default/models/critic.pt"
