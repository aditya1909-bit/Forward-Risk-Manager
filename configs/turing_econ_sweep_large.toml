[cluster]
enabled = true
netid = "asdutta"
scratch_root = "/local/scratch/asdutta/forward-risk-manager"
repo_root = "/local/scratch/asdutta/forward-risk-manager/repo"
data_root = "/local/scratch/asdutta/forward-risk-manager/data"
runs_root = "/local/scratch/asdutta/forward-risk-manager/runs"
cache_root = "/local/scratch/asdutta/forward-risk-manager/.cache"
logs_root = "/local/scratch/asdutta/forward-risk-manager/logs"
stage_graphs_to_local_nvme = false
sync_back_enabled = false

[train]
graphs = "/local/scratch/asdutta/forward-risk-manager/data/processed/graphs_master_ff_rich.pt.sharded"
device = "cuda"
loader_workers = 4
dataloader_pin_memory = true
dataloader_persistent_workers = true
torch_compile = false
distributed = false
risk_head_enabled = true
risk_ticker = "SPY"
portfolio_head_enabled = true
portfolio_ticker = "SPY"
risk_cache_dir = "/local/scratch/asdutta/forward-risk-manager/.cache/risk"
portfolio_cache_dir = "/local/scratch/asdutta/forward-risk-manager/.cache/portfolio"
auto_tune_cache_path = "/local/scratch/asdutta/forward-risk-manager/.cache/auto_tune_batch.json"
log_csv = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_sweep_large/metrics/ff_train.csv"
plot_path = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_sweep_large/plots/ff_train.png"
save_encoder = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_sweep_large/models/encoder.pt"
save_critic = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_sweep_large/models/critic.pt"
resume_state_path = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_sweep_large/models/train_resume.pt"

[benchmark]
out_csv = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_sweep_large/metrics/benchmark.csv"
baseline_out_csv = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_sweep_large/metrics/benchmark_baseline.csv"
walk_forward_out_csv = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_sweep_large/metrics/benchmark_walk_forward_folds.csv"
history_out_csv = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_sweep_large/metrics/benchmark_history.csv"
plot_path = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_sweep_large/plots/benchmark_speed_sep.png"
bar_plot_path = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_sweep_large/plots/benchmark.png"
resume_dir = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_sweep_large/models/benchmark_resume"

[sweep]
epochs = 12
batch_size = 32
eval_frac = 0.2
split_mode = "walk_forward"
walk_forward_train_frac = 0.6
walk_forward_eval_frac = 0.2
walk_forward_step_frac = 0.1
walk_forward_min_train_graphs = 128
walk_forward_min_eval_graphs = 32
walk_forward_max_folds = 0
walk_forward_max_folds_cap = 3
eval_neg_mode = "auto"
eval_neg_modes = ["time_flip", "block_bootstrap", "cross_asset_mix", "phase_randomize"]
eval_neg_top_k = 24
eval_neg_pre_rank_mode = "objective"
eval_neg_aggregate = "mean"
eval_neg_aggregate_include_base = true
eval_batch_size = 64
eval_loader_workers = 0
eval_pin_memory = true
early_stop_enabled = true
early_stop_min_epochs = 3
early_stop_patience = 3
early_stop_min_delta = 0.001
early_stop_eval_every = 1
early_stop_eval_graphs = 128
early_stop_rank_mode = "objective"
timing_warmup_epochs = 1
rank_mode = "finance_first"
composite_econ_metric = "econ_oos_sharpe_uplift_min"
composite_sep_metric = "eval_sep_agg_mean"
econ_weight = 0.70
sep_weight = 0.22
speed_weight = 0.08
econ_enabled = true
econ_ticker = "SPY,MDY,BWC,AAON,AUTO"
econ_signal_window = 252
econ_signal_quantile = 0.6
econ_signal_polarity = "auto"
econ_oos_folds = 4
econ_oos_min_fold_days = 63
econ_turnover_cost_bps = 1.0
econ_slippage_bps = 0.5
econ_slippage_vol_scale = 0.2
econ_slippage_vol_lookback = 21
econ_max_abs_logret = 0.5
econ_regime_gate_enabled = true
econ_regime_gate_window = 63
econ_regime_confidence_temp = 1.0
econ_regime_neutral_exposure = 0.2
econ_regime_min_confidence = 0.05
econ_regime_uncertainty_scale = 0.0
econ_regime_risk_scale = 0.0
econ_regime_thresholding_enabled = true
econ_regime_threshold_window = 252
econ_regime_threshold_quantile = 0.6
econ_regime_vol_window = 21
econ_regime_low_quantile = 0.30
econ_regime_high_quantile = 0.70
econ_top_k = 24
econ_pre_rank_mode = "objective"
successive_halving_enabled = true
successive_halving_stage_fracs = [0.25, 0.5, 1.0]
successive_halving_keep_ratio = 0.75
successive_halving_min_keep = 16
successive_halving_rank_mode = "objective"
successive_halving_disable_eval_neg_before_final = true
stability_penalty = true
stability_penalty_lambda = 0.5
finance_sep_gate_metric = "eval_sep_agg_min"
finance_sep_gate_floor = 0.01
finance_auroc_gate_metric = "eval_auroc_agg_min"
finance_auroc_gate_floor = ""
rank_gate_penalty = 1000000.0
out_csv = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_sweep_large/metrics/ff_sweep.csv"
modes = ["ff_layerwise", "ff_e2e"]
goodness_temp = [0.2, 0.25]
goodness_target = [2.2, 2.3]
neg_mix_end = [0.6, 0.75]
hall_steps = [3]
hall_lr = [0.025, 0.035]
hall_node_fraction = [0.35]
top_k = 12
parallel_workers = 1
parallel_backend = "process"
parallel_mp_context = "spawn"
parallel_force_cpu = false
worker_torch_threads = 1
worker_torch_interop_threads = 1
worker_loader_workers = 0
distributed = false
