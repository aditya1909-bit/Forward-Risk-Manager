hallucinate_corr_scope = "returns"
hallucinate_freeze_non_return_features = true
hallucinate_adaptive_lr = true
hallucinate_adaptive_lr_patience = 2
hallucinate_adaptive_lr_decay = 0.5
hallucinate_adaptive_lr_min = 0.0001
