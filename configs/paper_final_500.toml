distance_forward_weight = 0.02
distance_forward_margin = 0.15
ff_layerwise = false
ff_multiscale = true
energy_penalty_weight = 0.0001
energy_penalty_mode = "last"
risk_head_enabled = true
risk_ticker = "AUTO"
risk_horizon = 21
risk_loss_weight = 0.005
risk_loss_type = "huber"
risk_standardize = true
risk_cache_dir = "runs/cache"
risk_max_abs_logret = 0.5
neg_mode = "shuffle+noise"
noise_std = 0.05
amp = true
amp_dtype = "bfloat16"
fused_optimizer = true
device = "auto"
loader_workers = 0
torch_num_threads = 2
torch_num_interop_threads = 1
dataloader_persistent_workers = false
dataloader_prefetch_factor = 2
dataloader_pin_memory = true
dataloader_mp_context = ""
seed = 7
log_csv = "runs/experiments/paper_final_500_TEMPLATE/metrics/ff_train.csv"
