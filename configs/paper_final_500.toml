[build_graphs]
prices = "data/processed_long/prices.csv"
constituents = "data/processed_long/constituents.csv"
macro = ""
macro_auto = true
macro_auto_short_window = 21
macro_auto_long_window = 63
static_edges = ""
out = "runs/experiments/paper_final_500_TEMPLATE/data/graphs.pt"
membership_mode = "constituents"
window = 20
step = 1
corr_lag_days = 0
feature_lag_days = 0
membership_lag_days = 0
macro_lag_days = 1
top_k = 5
corr_threshold = ""
min_nodes = 50
feature_mode = "window_plus_summary"
rsi_period = 14
mdy_ticker = "AUTO"
normalize = true
symmetric = true
edge_norm = true
edge_weight_mode = "raw"
corr_method = "pearson"
partial_corr_ridge = 0.001
edge_select_mode = "top_k"
