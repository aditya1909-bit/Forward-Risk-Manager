[cluster]
enabled = true
netid = "asdutta"
scratch_root = "/local/scratch/asdutta/forward-risk-manager"
repo_root = "/local/scratch/asdutta/forward-risk-manager/repo"
data_root = "/local/scratch/asdutta/forward-risk-manager/data"
runs_root = "/local/scratch/asdutta/forward-risk-manager/runs"
cache_root = "/local/scratch/asdutta/forward-risk-manager/.cache"
logs_root = "/local/scratch/asdutta/forward-risk-manager/logs"
stage_graphs_to_local_nvme = false
sync_back_enabled = false

[train]
graphs = "/local/scratch/asdutta/forward-risk-manager/data/processed/graphs_master_ff_rich.pt.sharded"
device = "cuda"
loader_workers = 4
dataloader_pin_memory = true
dataloader_persistent_workers = true
torch_compile = false
distributed = false
risk_head_enabled = true
risk_ticker = "SPY"
portfolio_head_enabled = true
portfolio_ticker = "SPY"
resume_enabled = true
resume_save_every_epochs = 1
resume_save_every_minutes = 55
resume_on_signal = true
risk_cache_dir = "/local/scratch/asdutta/forward-risk-manager/.cache/risk"
portfolio_cache_dir = "/local/scratch/asdutta/forward-risk-manager/.cache/portfolio"
auto_tune_cache_path = "/local/scratch/asdutta/forward-risk-manager/.cache/auto_tune_batch.json"
log_csv = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_large/metrics/ff_train.csv"
plot_path = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_large/plots/ff_train.png"
save_encoder = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_large/models/encoder.pt"
save_critic = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_large/models/critic.pt"
resume_state_path = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_large/models/train_resume.pt"

[benchmark]
epochs = 20
batch_size = 32
eval_frac = 0.2
split_mode = "walk_forward"
walk_forward_train_frac = 0.6
walk_forward_eval_frac = 0.2
walk_forward_step_frac = 0.1
walk_forward_min_train_graphs = 128
walk_forward_min_eval_graphs = 32
walk_forward_max_folds = 0
seeds = [7, 17, 27, 37, 47]
seed_bootstrap_samples = 2000
seed_bootstrap_alpha = 0.05
torch_compile = false
distributed = false
enable_risk_head = true
enable_portfolio_head = true
retry_safe_on_error = true
continue_on_mode_error = true
calibrate_target = true
calibrate_batches = 0
calibrate_quantiles = 31
econ_enabled = true
econ_ticker = "SPY"
econ_signal_window = 252
econ_signal_quantile = 0.6
econ_signal_polarity = "auto"
econ_oos_folds = 4
econ_oos_min_fold_days = 63
econ_turnover_cost_bps = 1.0
econ_slippage_bps = 0.5
econ_slippage_vol_scale = 0.2
econ_slippage_vol_lookback = 21
econ_short_borrow_bps = 0.0
econ_max_abs_exposure = 1.0
econ_max_abs_logret = 0.5
econ_regime_gate_enabled = false
econ_regime_thresholding_enabled = true
econ_regime_threshold_window = 252
econ_regime_threshold_quantile = 0.6
econ_regime_vol_window = 21
econ_regime_low_quantile = 0.33
econ_regime_high_quantile = 0.67
resume_enabled = true
resume_save_every_epochs = 1
resume_save_every_minutes = 55
resume_on_signal = true
out_csv = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_large/metrics/benchmark.csv"
baseline_out_csv = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_large/metrics/benchmark_baseline.csv"
walk_forward_out_csv = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_large/metrics/benchmark_walk_forward_folds.csv"
history_out_csv = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_large/metrics/benchmark_history.csv"
plot_path = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_large/plots/benchmark_speed_sep.png"
bar_plot_path = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_large/plots/benchmark.png"
resume_dir = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_large/models/benchmark_resume"

[sweep]
out_csv = "/local/scratch/asdutta/forward-risk-manager/runs/experiments/turing_econ_large/metrics/ff_sweep.csv"
